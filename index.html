<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>HASP Studio</title>

<style>
:root{
  --bg:#0b0d11;
  --panel:#14181f;
  --panel2:#1c222c;
  --line:#303846;
  --text:#f5f7fb;
  --muted:#929baa;
  --blue:#55a7ff;
  --danger:#ff6c72;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  background:rgba(11,13,17,.94);
  border-bottom:1px solid var(--line);
}
h1{font-size:22px;margin:0}
small{color:var(--muted)}
button,select,input{
  font:inherit;
}
button{
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  font-weight:600;
}
button.primary{
  background:var(--blue);
  color:#06101c;
  border:0;
}
main{
  max-width:1200px;
  margin:auto;
  padding:12px;
  display:grid;
  grid-template-columns:240px 1fr 270px;
  gap:12px;
}
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}
.panel h2{
  margin:0 0 12px;
  font-size:17px;
}
.pages{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.page{
  display:flex;
  justify-content:space-between;
}
.page.active{
  border-color:var(--blue);
}
.palette{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}
label{
  display:grid;
  gap:5px;
  margin-bottom:10px;
  color:var(--muted);
  font-size:12px;
}
input,select{
  width:100%;
  padding:9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0b0e13;
  color:var(--text);
}
.toolbar{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.stagebox{
  background:#0d1117;
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
}
#stage{
  position:relative;
  width:100%;
  max-width:620px;
  margin:auto;
  aspect-ratio:1;
  overflow:hidden;
  border-radius:10px;
  border:1px solid #3b4451;
  background-color:#05070a;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:5% 5%;
  touch-action:none;
}
.obj{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  user-select:none;
  touch-action:none;
  color:white;
  background:#222935;
  border:1px solid #455064;
  border-radius:8px;
  font-size:14px;
  text-align:center;
}
.obj.label{
  justify-content:flex-start;
  background:transparent;
  border-color:transparent;
}
.obj.switch{
  border-radius:999px;
  background:#303744;
}
.obj.switch.on{
  background:#357ed6;
}
.obj.slider:before,
.obj.bar:before{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  height:22%;
  background:#343c49;
  border-radius:999px;
}
.obj.slider:after,
.obj.bar:after{
  content:"";
  position:absolute;
  left:8%;
  width:48%;
  height:22%;
  background:var(--blue);
  border-radius:999px;
}
.obj.arc{
  border:8px solid #333b49;
  border-top-color:var(--blue);
  border-radius:50%;
  background:transparent;
}
.obj.selected{
  outline:2px solid var(--blue);
  outline-offset:2px;
  z-index:10;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.row4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}
.hidden{display:none}
.hint{
  color:var(--muted);
  font-size:11px;
  margin-top:8px;
}
hr{
  border:0;
  border-top:1px solid var(--line);
  margin:16px 0;
}
#toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translate(-50%,150%);
  background:#fff;
  color:#111;
  padding:10px 14px;
  border-radius:999px;
  transition:.2s;
  z-index:100;
}
#toast.show{
  transform:translate(-50%,0);
}
@media(max-width:850px){
  main{
    display:flex;
    flex-direction:column;
  }
  .workspace{
    order:-1;
  }
  .pages{
    flex-direction:row;
    overflow:auto;
  }
  .page{
    min-width:115px;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <small>openHASP Editor</small>
    <h1>HASP Studio</h1>
  </div>
  <div>
    <button onclick="save()">Speichern</button>
    <button class="primary" onclick="exportJSONL()">JSONL</button>
  </div>
</header>

<main>

<section class="panel">
  <h2>Seiten</h2>
  <div id="pages" class="pages"></div>

  <button style="margin-top:9px;width:100%" onclick="addPage()">
    + Seite
  </button>

  <hr>

  <label>
    Vorlage
    <select id="template">
      <option value="home">Startseite</option>
      <option value="lights">Licht</option>
      <option value="weather">Wetter</option>
      <option value="media">Sonos / Medien</option>
      <option value="system">System</option>
    </select>
  </label>

  <button style="width:100%" onclick="applyTemplate()">
    Vorlage einsetzen
  </button>

  <hr>

  <small>Objekt hinzufügen</small>

  <div class="palette">
    <button onclick="addObj('label')">Text</button>
    <button onclick="addObj('btn')">Button</button>
    <button onclick="addObj('switch')">Switch</button>
    <button onclick="addObj('slider')">Slider</button>
    <button onclick="addObj('bar')">Bar</button>
    <button onclick="addObj('arc')">Arc</button>
  </div>
</section>


<section class="workspace">

  <div class="toolbar">
    <div>
      <input id="dw" type="number" value="480" style="width:70px">
      ×
      <input id="dh" type="number" value="480" style="width:70px">
    </div>
    <small>Displaygröße</small>
  </div>

  <div class="stagebox">
    <div id="stage"></div>
  </div>

  <div class="hint">
    Objekt antippen und mit dem Finger verschieben.
  </div>

</section>


<section class="panel">

  <h2>Eigenschaften</h2>

  <div id="empty">
    <small>Wähle ein Objekt auf dem Display aus.</small>
  </div>

  <div id="props" class="hidden">

    <div class="row">
      <label>
        Seite
        <input id="pPage" type="number">
      </label>

      <label>
        ID
        <input id="pId" type="number">
      </label>
    </div>

    <label>
      Typ
      <select id="pObj">
        <option>label</option>
        <option>btn</option>
        <option>switch</option>
        <option>slider</option>
        <option>bar</option>
        <option>arc</option>
      </select>
    </label>

    <label>
      Text
      <input id="pText">
    </label>

    <div class="row4">
      <label>X<input id="pX" type="number"></label>
      <label>Y<input id="pY" type="number"></label>
      <label>W<input id="pW" type="number"></label>
      <label>H<input id="pH" type="number"></label>
    </div>

    <label>
      Wert
      <input id="pVal" type="number">
    </label>

    <label>
      Hintergrund
      <input id="pBg">
    </label>

    <label>
      Textfarbe
      <input id="pColor">
    </label>

    <button onclick="updateSelected()" style="width:100%">
      Änderungen übernehmen
    </button>

    <button onclick="deleteSelected()"
            style="width:100%;margin-top:8px;color:var(--danger)">
      Objekt löschen
    </button>

  </div>

  <hr>

  <h2>Gerät</h2>

  <label>
    IP / Hostname
    <input id="host" placeholder="192.168.1.50">
  </label>

  <button onclick="openDevice()" style="width:100%">
    openHASP WebUI öffnen
  </button>

  <hr>

  <label>
    JSONL importieren
    <input id="importFile"
           type="file"
           accept=".jsonl,.txt">
  </label>

</section>

</main>

<div id="toast"></div>


<script>

const STORAGE="hasp-studio-v1";

let project={
  display:{width:480,height:480},
  activePage:1,
  pages:[
    {id:1,name:"Start",objects:[]}
  ],
  device:{host:""}
};

let selected=null;
let drag=null;

const templates={

home:[
 {id:1,obj:"label",x:24,y:20,w:260,h:55,text:"HASP Home"},
 {id:2,obj:"label",x:320,y:20,w:130,h:55,text:"20:33"},
 {id:10,obj:"btn",x:24,y:110,w:130,h:100,text:"Licht"},
 {id:11,obj:"btn",x:175,y:110,w:130,h:100,text:"Sonos"},
 {id:12,obj:"btn",x:326,y:110,w:130,h:100,text:"Wetter"},
 {id:20,obj:"label",x:24,y:250,w:432,h:55,text:"21° • leicht bewölkt"},
 {id:21,obj:"bar",x:24,y:340,w:432,h:38,val:62},
 {id:22,obj:"label",x:24,y:400,w:432,h:45,text:"Sonnenuntergang 20:37"}
],

lights:[
 {id:1,obj:"label",x:24,y:20,w:300,h:55,text:"Licht & Nanoleaf"},
 {id:10,obj:"btn",x:24,y:100,w:200,h:90,text:"Wohnzimmer"},
 {id:11,obj:"btn",x:256,y:100,w:200,h:90,text:"Küche"},
 {id:12,obj:"btn",x:24,y:220,w:200,h:90,text:"Flur"},
 {id:13,obj:"btn",x:256,y:220,w:200,h:90,text:"Nanoleaf"},
 {id:20,obj:"slider",x:24,y:360,w:432,h:55,val:65}
],

weather:[
 {id:1,obj:"label",x:24,y:20,w:280,h:55,text:"Wetter"},
 {id:2,obj:"label",x:24,y:95,w:180,h:100,text:"21°"},
 {id:3,obj:"label",x:230,y:95,w:220,h:100,text:"Leicht bewölkt"},
 {id:10,obj:"label",x:24,y:245,w:205,h:60,text:"Aufgang 06:17"},
 {id:11,obj:"label",x:251,y:245,w:205,h:60,text:"Untergang 20:37"},
 {id:20,obj:"bar",x:24,y:350,w:432,h:35,val:42},
 {id:21,obj:"label",x:24,y:405,w:432,h:45,text:"Regenrisiko 42 %"}
],

media:[
 {id:1,obj:"label",x:24,y:20,w:320,h:55,text:"Sonos / Medien"},
 {id:10,obj:"btn",x:24,y:110,w:100,h:90,text:"◀"},
 {id:11,obj:"btn",x:190,y:100,w:100,h:110,text:"▶"},
 {id:12,obj:"btn",x:356,y:110,w:100,h:90,text:"▶▶"},
 {id:20,obj:"slider",x:24,y:270,w:432,h:55,val:35},
 {id:21,obj:"label",x:24,y:345,w:432,h:45,text:"Lautstärke 35 %"},
 {id:22,obj:"label",x:24,y:410,w:432,h:45,text:"Keine Wiedergabe"}
],

system:[
 {id:1,obj:"label",x:24,y:20,w:300,h:55,text:"System"},
 {id:10,obj:"label",x:24,y:100,w:432,h:55,text:"openHASP • ESP32-S3"},
 {id:11,obj:"label",x:24,y:175,w:432,h:55,text:"WLAN • DHCP"},
 {id:12,obj:"label",x:24,y:250,w:432,h:55,text:"Display • 480 × 480"},
 {id:13,obj:"label",x:24,y:325,w:432,h:55,text:"BLE • Roadmap"}
]

};

function page(){
  return project.pages.find(x=>x.id===project.activePage);
}

function newId(){
  let used=new Set(page().objects.map(x=>x.id));
  for(let i=1;i<=254;i++){
    if(!used.has(i)) return i;
  }
}

function baseObj(type){
  let o={
    page:project.activePage,
    id:newId(),
    obj:type,
    x:70,
    y:70,
    w:170,
    h:60,
    text:"",
    val:0,
    bg_color:"#222935",
    text_color:"#ffffff"
  };

  if(type==="label"){
    o.text="Text";
    o.bg_color="transparent";
  }

  if(type==="btn") o.text="Button";

  if(type==="switch"){
    o.w=105;
    o.h=50;
  }

  if(type==="slider"){
    o.w=260;
    o.h=50;
    o.val=50;
  }

  if(type==="bar"){
    o.w=260;
    o.h=35;
    o.val=50;
  }

  if(type==="arc"){
    o.w=120;
    o.h=120;
    o.val=50;
  }

  return o;
}

function render(){
  renderPages();
  renderStage();
  renderProps();

  document.getElementById("dw").value=project.display.width;
  document.getElementById("dh").value=project.display.height;

  document.getElementById("stage").style.aspectRatio=
    project.display.width+"/"+project.display.height;

  document.getElementById("host").value=
    project.device.host||"";
}

function renderPages(){

  let box=document.getElementById("pages");
  box.innerHTML="";

  project.pages.forEach(p=>{

    let b=document.createElement("button");

    b.className="page "+(
      p.id===project.activePage ? "active":""
    );

    b.innerHTML=
      "<span>"+p.name+"</span>"+
      "<small>p"+p.id+"</small>";

    b.onclick=()=>{
      project.activePage=p.id;
      selected=null;
      render();
    };

    box.appendChild(b);
  });
}

function renderStage(){

  let stage=document.getElementById("stage");
  stage.innerHTML="";

  let dw=project.display.width;
  let dh=project.display.height;

  page().objects.forEach(o=>{

    let el=document.createElement("div");

    el.className=
      "obj "+o.obj+
      (o.val ? " on":"")+
      (selected===o ? " selected":"");

    el.style.left=(o.x/dw*100)+"%";
    el.style.top=(o.y/dh*100)+"%";
    el.style.width=(o.w/dw*100)+"%";
    el.style.height=(o.h/dh*100)+"%";

    if(o.bg_color &&
       o.bg_color!=="transparent" &&
       !["switch","slider","bar","arc"].includes(o.obj)){
      el.style.background=o.bg_color;
    }

    if(o.bg_color==="transparent"){
      el.style.background="transparent";
    }

    if(o.text_color){
      el.style.color=o.text_color;
    }

    if(o.obj==="label" || o.obj==="btn"){
      el.textContent=o.text||o.obj;
    }

    el.onpointerdown=e=>{
      e.preventDefault();

      selected=o;

      drag={
        x:e.clientX,
        y:e.clientY,
        ox:o.x,
        oy:o.y
      };

      el.setPointerCapture?.(e.pointerId);

      renderProps();
      renderStage();
    };

    el.onclick=e=>{
      e.stopPropagation();
      selected=o;
      renderProps();
      renderStage();
    };

    stage.appendChild(el);
  });

  stage.onclick=()=>{
    selected=null;
    renderProps();
    renderStage();
  };
}

window.onpointermove=e=>{

  if(!drag || !selected) return;

  let stage=document.getElementById("stage");
  let r=stage.getBoundingClientRect();

  let dx=(e.clientX-drag.x)*
    project.display.width/r.width;

  let dy=(e.clientY-drag.y)*
    project.display.height/r.height;

  selected.x=Math.max(
    0,
    Math.min(
      project.display.width-selected.w,
      Math.round(drag.ox+dx)
    )
  );

  selected.y=Math.max(
    0,
    Math.min(
      project.display.height-selected.h,
      Math.round(drag.oy+dy)
    )
  );

  renderStage();
};

window.onpointerup=()=>{
  if(drag){
    drag=null;
    save(false);
    renderProps();
  }
};

function renderProps(){

  let empty=document.getElementById("empty");
  let props=document.getElementById("props");

  if(!selected){
    empty.classList.remove("hidden");
    props.classList.add("hidden");
    return;
  }

  empty.classList.add("hidden");
  props.classList.remove("hidden");

  pPage.value=selected.page;
  pId.value=selected.id;
  pObj.value=selected.obj;
  pText.value=selected.text||"";
  pX.value=selected.x;
  pY.value=selected.y;
  pW.value=selected.w;
  pH.value=selected.h;
  pVal.value=selected.val||0;
  pBg.value=selected.bg_color||"";
  pColor.value=selected.text_color||"";
}

function updateSelected(){

  if(!selected) return;

  selected.page=Number(pPage.value);
  selected.id=Number(pId.value);
  selected.obj=pObj.value;
  selected.text=pText.value;
  selected.x=Number(pX.value);
  selected.y=Number(pY.value);
  selected.w=Number(pW.value);
  selected.h=Number(pH.value);
  selected.val=Number(pVal.value);
  selected.bg_color=pBg.value;
  selected.text_color=pColor.value;

  save(false);
  render();
}

function addObj(type){

  let o=baseObj(type);

  page().objects.push(o);

  selected=o;

  save(false);
  render();
}

function deleteSelected(){

  if(!selected) return;

  page().objects=
    page().objects.filter(x=>x!==selected);

  selected=null;

  save(false);
  render();
}

function addPage(){

  let ids=new Set(project.pages.map(x=>x.id));

  let id=1;

  while(ids.has(id) && id<=12) id++;

  if(id>12){
    toast("Maximal Seite 12");
    return;
  }

  project.pages.push({
    id:id,
    name:"Seite "+id,
    objects:[]
  });

  project.activePage=id;
  selected=null;

  save(false);
  render();
}

function applyTemplate(){

  let name=document.getElementById("template").value;

  let p=page();

  p.name={
    home:"Start",
    lights:"Licht",
    weather:"Wetter",
    media:"Medien",
    system:"System"
  }[name];

  p.objects=
    templates[name].map(o=>({
      page:p.id,
      bg_color:
        o.obj==="label" ?
        "transparent":
        "#222935",
      text_color:"#ffffff",
      ...o
    }));

  selected=null;

  save(false);
  render();

  toast("Vorlage eingesetzt");
}

function save(show=true){

  project.display.width=
    Number(document.getElementById("dw").value)||480;

  project.display.height=
    Number(document.getElementById("dh").value)||480;

  project.device.host=
    document.getElementById("host").value.trim();

  localStorage.setItem(
    STORAGE,
    JSON.stringify(project)
  );

  if(show) toast("Projekt gespeichert");
}

function exportJSONL(){

  save(false);

  let lines=[];

  project.pages
    .sort((a,b)=>a.id-b.id)
    .forEach(p=>{

      p.objects.forEach(o=>{

        let out={
          page:p.id,
          id:o.id,
          obj:o.obj,
          x:o.x,
          y:o.y,
          w:o.w,
          h:o.h
        };

        if(o.text) out.text=o.text;

        if(["switch","slider","bar","arc"].includes(o.obj)){
          out.val=o.val||0;
        }

        if(o.bg_color &&
           o.bg_color!=="transparent"){
          out.bg_color=o.bg_color;
        }

        if(o.text_color){
          out.text_color=o.text_color;
        }

        lines.push(JSON.stringify(out));
      });
    });

  let blob=new Blob(
    [lines.join("\n")+"\n"],
    {type:"text/plain"}
  );

  let a=document.createElement("a");

  a.href=URL.createObjectURL(blob);
  a.download="pages.jsonl";

  a.click();

  setTimeout(()=>{
    URL.revokeObjectURL(a.href);
  },500);

  toast("pages.jsonl erstellt");
}

function openDevice(){

  let host=
    document.getElementById("host").value.trim();

  if(!host){
    toast("IP eintragen");
    return;
  }

  if(!host.startsWith("http")){
    host="http://"+host;
  }

  window.open(host,"_blank");
}

document.getElementById("importFile")
.addEventListener("change",e=>{

  let file=e.target.files[0];

  if(!file) return;

  let reader=new FileReader();

  reader.onload=()=>{

    try{

      let pages={};

      String(reader.result)
        .split(/\r?\n/)
        .filter(Boolean)
        .forEach(line=>{

          let o=JSON.parse(line);

          let pid=Number(o.page||1);

          if(!pages[pid]){
            pages[pid]=[];
          }

          pages[pid].push({
            bg_color:"#222935",
            text_color:"#ffffff",
            ...o,
            page:pid
          });
        });

      project.pages=
        Object.keys(pages)
          .map(Number)
          .sort((a,b)=>a-b)
          .map(id=>({
            id:id,
            name:"Seite "+id,
            objects:pages[id]
          }));

      project.activePage=
        project.pages[0]?.id||1;

      selected=null;

      save(false);
      render();

      toast("JSONL importiert");

    }catch{
      toast("Import fehlgeschlagen");
    }
  };

  reader.readAsText(file);
});

function toast(text){

  let t=document.getElementById("toast");

  t.textContent=text;
  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },1800);
}

let saved=localStorage.getItem(STORAGE);

if(saved){
  try{
    project=JSON.parse(saved);
  }catch{}
}

if(!project.pages[0].objects.length){
  applyTemplate();
}else{
  render();
}

document.getElementById("dw")
.addEventListener("change",()=>{
  project.display.width=
    Number(dw.value)||480;
  save(false);
  render();
});

document.getElementById("dh")
.addEventListener("change",()=>{
  project.display.height=
    Number(dh.value)||480;
  save(false);
  render();
});

render();

</script>

</body>
</html>
